name: daily-board

on:
  schedule:
    # 北京时间 20:10 = UTC 12:10（原站 20:00 更新，我们延后 10 分钟抓取当天内容）
    - cron: "10 12 * * *"
  workflow_dispatch: {}        # 允许手动触发，便于调试

permissions:
  contents: write              # 允许 workflow 把生成的页面 commit 回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: generate
        run: python generate.py

      - name: commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes, skip"
          else
            git commit -m "update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M CST')"
            git push
          fi
